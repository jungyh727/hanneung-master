/* v6 · lighter home, clearer study menu and review cards */
:root{background:#f8fbf9;color:#25453d}
header{display:flex;align-items:center;gap:12px;background:#e2f0e8;color:#244c40;border-bottom:1px solid #d0e5d7;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:18px}
header h1{color:#234c3e;font-size:22px}
header small{color:#53796b}
#app-back{display:flex;align-items:center;justify-content:center;width:39px;height:39px;padding:0;flex:none;font-size:32px;line-height:1;color:#2c5c4a;background:#f5fbf7;border:1px solid #c5ddce;border-radius:12px}
.card{box-shadow:0 2px 9px #204c3510;border-color:#deebe1}
.home-hero{background:linear-gradient(135deg,#eff8f2,#dcefe3);color:#255442;border-color:#d1e6d8}
.home-hero h2{color:#214d3a}
.hero-eyebrow{font-size:12px;color:#547f65;font-weight:650}
.hero-description{font-size:13px;color:#426c57}
.home-hero button.primary{background:#39795d;border-color:#39795d}
.home-menu{background:#edf5f0;border-color:#d6e7db}
.home-menu h3{color:#315d49}
.home-menu button{background:#fcfffd;box-shadow:0 2px 5px #21553b13;border:1px solid #d1e1d6}
.metric{background:#f0f7f1}
.wrong-card{background:#fff;border:1px solid #d3e1d8;box-shadow:0 3px 10px #203b2a0d;border-radius:15px;padding:16px;margin:16px 0 21px}
.review-tags{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.review-question{font-size:14px;white-space:pre-line;line-height:1.75;font-weight:600}
.review-options{display:grid;gap:8px;margin:14px 0}
.review-option{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border-radius:11px;background:#f7faf8;border:1px solid #e2e9e5;font-size:13px;line-height:1.55}
.review-number{flex:none;font-weight:700}
.review-option-text{flex:1;white-space:pre-line;min-width:0}
.review-label{flex:none;font-size:11px;white-space:nowrap}
.review-option.review-incorrect{background:#fff0ef;border:1px solid #e9aba7;color:#a83333}
.review-option.review-correct{background:#e8f7ed;border:1px solid #93d4a9;color:#176e42}
.review-session{margin-top:14px;padding:12px;border:1px solid #d5e4db;border-radius:13px;background:#f8fbf9}
.review-session summary{cursor:pointer;list-style-position:outside;margin-left:8px;padding:4px;line-height:1.7}
.review-session .wrong-card{margin:12px 0}
.review-session>button{margin-top:6px}
